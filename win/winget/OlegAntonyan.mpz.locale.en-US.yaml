ShortDescription: Music player for large local collections
Description: |-
  A folder player for big local music collections. Instead of indexing every file
  into a library, mpz treats your files and folders as the library and provides a
  convenient way to build playlists directly from folders.

  The main feature is the three-column UI: a directory tree, the list of playlists,
  and the tracks of the current playlist. Choose library folders, middle-click a
  folder, and a playlist is created from it.

  Also supported: gapless playback, a 10-band and parametric equalizer with AutoEq
  presets, internet radio, CUE sheets, a tag editor, cover art and lyrics, and an
  experimental MPD client mode.
